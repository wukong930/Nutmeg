name: Nutmeg CI

on:
  pull_request:
  push:
    branches:
      - main
      - "v5/**"

jobs:
  v4-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install libomp (LightGBM runtime)
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install uv
        run: python -m pip install uv
      - name: Sync dependencies
        run: |
          uv venv
          uv sync --all-extras
      - name: Run V4 tests
        run: |
          PYTHONPATH=apps/api/src .venv/bin/python -m pytest tests/v4/ -q
      - name: Lint
        run: .venv/bin/ruff check apps/api/src tests
