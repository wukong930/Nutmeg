name: Nutmeg CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nutmeg
          POSTGRES_PASSWORD: nutmeg
          POSTGRES_DB: nutmeg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutmeg -d nutmeg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Install backend dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Run backend tests
        run: .venv/bin/pytest
      - name: Run backend lint
        run: .venv/bin/ruff check .
      - name: Run backend typecheck
        run: .venv/bin/mypy apps/api/src
      - name: Run Accuracy Postgres smoke
        env:
          NUTMEG_DATABASE_URL: postgresql://nutmeg:nutmeg@localhost:5432/nutmeg
        run: .venv/bin/python -m nutmeg.accuracy.postgres_smoke

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend typecheck
        run: npm run typecheck
      - name: Run frontend lint
        run: npm run lint
      - name: Build frontend
        run: npm run build
