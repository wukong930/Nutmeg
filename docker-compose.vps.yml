name: nutmeg

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutmeg
      POSTGRES_PASSWORD: nutmeg
      POSTGRES_DB: nutmeg
    volumes:
      - nutmeg_vps_postgres:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutmeg -d nutmeg"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NUTMEG_ENV: vps
      NUTMEG_DATABASE_URL: postgresql://nutmeg:nutmeg@postgres:5432/nutmeg
      NUTMEG_DATABASE_CONNECT_TIMEOUT_SECONDS: 5
      NUTMEG_REDIS_URL: redis://redis:6379/0
      NUTMEG_COMPETITION_CONFIG_DIR: configs/competitions
      NUTMEG_ACCURACY_REPOSITORY: postgres
      NUTMEG_ACCURACY_JOBS_ENABLED: "false"
      NUTMEG_PROVIDER_GOVERNANCE_REPOSITORY: postgres
      NUTMEG_PARLAY_REPOSITORY: postgres
      NUTMEG_ADMIN_API_TOKEN: ${NUTMEG_ADMIN_API_TOKEN:-}
      NUTMEG_PROVIDER_SYNC_ENABLED: ${NUTMEG_PROVIDER_SYNC_ENABLED:-true}
      NUTMEG_PROVIDER_SYNC_WORKFLOW_ENABLED: ${NUTMEG_PROVIDER_SYNC_WORKFLOW_ENABLED:-true}
      NUTMEG_PROVIDER_SYNC_MOCK_DRY_RUN_ENABLED: ${NUTMEG_PROVIDER_SYNC_MOCK_DRY_RUN_ENABLED:-true}
      NUTMEG_PREDICTION_JOBS_ENABLED: ${NUTMEG_PREDICTION_JOBS_ENABLED:-false}
      NUTMEG_PREMATCH_WORKFLOW_ENABLED: ${NUTMEG_PREMATCH_WORKFLOW_ENABLED:-false}
      NUTMEG_PROVIDER_RUNTIME_INCIDENT_NOTIFICATION_ENABLED: ${NUTMEG_PROVIDER_RUNTIME_INCIDENT_NOTIFICATION_ENABLED:-false}
      NUTMEG_PROVIDER_RUNTIME_INCIDENT_NOTIFICATION_ADAPTER: ${NUTMEG_PROVIDER_RUNTIME_INCIDENT_NOTIFICATION_ADAPTER:-provider_ops}
      NUTMEG_PROVIDER_RUNTIME_INCIDENT_NOTIFICATION_DRY_RUN: ${NUTMEG_PROVIDER_RUNTIME_INCIDENT_NOTIFICATION_DRY_RUN:-true}
      NUTMEG_PROVIDER_RUNTIME_INCIDENT_NOTIFICATION_WEBHOOK_URL: ${NUTMEG_PROVIDER_RUNTIME_INCIDENT_NOTIFICATION_WEBHOOK_URL:-}
      NUTMEG_FOOTBALL_DATA_API_KEY: ${NUTMEG_FOOTBALL_DATA_API_KEY:-}
      NUTMEG_API_FOOTBALL_API_KEY: ${NUTMEG_API_FOOTBALL_API_KEY:-}
      NUTMEG_API_FOOTBALL_API_BASE_URL: ${NUTMEG_API_FOOTBALL_API_BASE_URL:-https://v3.football.api-sports.io}
      NUTMEG_THE_ODDS_API_KEY: ${NUTMEG_THE_ODDS_API_KEY:-}
      NUTMEG_SPORTMONKS_API_KEY: ${NUTMEG_SPORTMONKS_API_KEY:-}
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NUTMEG_API_BASE_URL: http://api:8000/api/v1
      NUTMEG_API_TIMEOUT_MS: 2500
      NUTMEG_ADMIN_API_TOKEN: ${NUTMEG_ADMIN_API_TOKEN:-}
      NUTMEG_PROVIDER_OPS_UI_TOKEN: ${NUTMEG_PROVIDER_OPS_UI_TOKEN:-}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      - api

volumes:
  nutmeg_vps_postgres:
