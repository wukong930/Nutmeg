[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nutmeg"
version = "0.5.0"
description = "Nutmeg V5 — GBM-lambda + Dixon-Coles football prediction platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # API
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6.0",
  # V4 data science stack
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "duckdb>=1.0",
  "pyarrow>=16.0",
  # V5 W3+ external data ingest
  "httpx>=0.27",
  "tenacity>=8.5",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "understat>=0.1.4",
  "aiohttp>=3.10",
  "pyreadr>=0.5.6",
  "xgboost>=3.2.0",
  "catboost>=1.2.10",
  "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
  # post-v9 P1#15: front-end E2E + WCAG audit via Playwright + axe-core
  "playwright>=1.55",
  "pytest-playwright>=0.8",
  # NOTE: axe-core itself is loaded via CDN at test time (no Python package
  # needed). After install run `.venv/bin/playwright install chromium`.
]

[project.scripts]
nutmeg-api = "nutmeg.main:run"
nutmeg-bench = "nutmeg.v4.cli.bench:main"
nutmeg-bench-multi = "nutmeg.v4.cli.multi_season_bench:main"
nutmeg-train = "nutmeg.v4.cli.train:main"
nutmeg-recommend = "nutmeg.v4.cli.recommend:main"
nutmeg-record-outcome = "nutmeg.v4.cli.record_outcome:main"
nutmeg-roi-report = "nutmeg.v4.cli.roi_report:main"
nutmeg-ingest-external = "nutmeg.v4.cli.ingest_external:main"
nutmeg-live-vs-backtest = "nutmeg.v4.cli.live_vs_backtest:main"
nutmeg-experiment-diff = "nutmeg.v4.cli.experiment_diff:main"
nutmeg-recommend-pool = "nutmeg.v4.cli.recommend_pool:main"
nutmeg-ingest-lineups = "nutmeg.v4.cli.ingest_lineups:main"
nutmeg-refresh-lineups = "nutmeg.v4.cli.refresh_lineups:main"
nutmeg-ab-report = "nutmeg.v4.cli.ab_report:main"
nutmeg-rec = "nutmeg.v4.cli.rec:main"
nutmeg-ingest-odds = "nutmeg.v4.cli.ingest_odds:main"
nutmeg-auto-settle = "nutmeg.v4.cli.auto_settle:main"
nutmeg-weekly-report = "nutmeg.v4.cli.weekly_report:main"
nutmeg-ingest-cup-history = "nutmeg.v4.cli.ingest_cup_history:main"
nutmeg-ingest-cup-odds = "nutmeg.v4.cli.ingest_cup_odds:main"
nutmeg-canonical-report-cup = "nutmeg.v4.cli.canonical_report_cup:main"
nutmeg-cup-ablation = "nutmeg.v4.cli.cup_ablation:main"
nutmeg-ingest-national-elo = "nutmeg.v4.cli.ingest_national_elo:main"
nutmeg-ece-audit = "nutmeg.v4.cli.ece_audit:main"
nutmeg-cat-calibration-ablation = "nutmeg.v4.cli.cat_calibration_ablation:main"
nutmeg-roi-backtest = "nutmeg.v4.cli.roi_backtest:main"
nutmeg-ingest-cup-odds-via-odds-api = "nutmeg.v4.cli.ingest_cup_odds_via_odds_api:main"
nutmeg-wc-predict = "nutmeg.v4.cli.wc_predict:main"
nutmeg-auto-calibration = "nutmeg.v4.cli.auto_calibration:main"
nutmeg-wc-settle = "nutmeg.v4.cli.wc_settle:main"
nutmeg-wc-report = "nutmeg.v4.cli.wc_report:main"
nutmeg-ingest-team-logos = "nutmeg.v4.cli.ingest_team_logos:main"

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api/src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = []
mypy_path = "apps/api/src"
strict = true
warn_unreachable = true
warn_unused_ignores = true
exclude = ["\\.venv/"]
