[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nutmeg"
version = "0.5.0"
description = "Nutmeg V5 — GBM-lambda + Dixon-Coles football prediction platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # API
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6.0",
  # V4 data science stack
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "duckdb>=1.0",
  "pyarrow>=16.0",
  # V5 W3+ external data ingest
  "httpx>=0.27",
  "tenacity>=8.5",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "understat>=0.1.4",
  "aiohttp>=3.10",
  "pyreadr>=0.5.6",
  "xgboost>=3.2.0",
  "catboost>=1.2.10",
  "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]

[project.scripts]
nutmeg-api = "nutmeg.main:run"
nutmeg-bench = "nutmeg.v4.cli.bench:main"
nutmeg-bench-multi = "nutmeg.v4.cli.multi_season_bench:main"
nutmeg-train = "nutmeg.v4.cli.train:main"
nutmeg-recommend = "nutmeg.v4.cli.recommend:main"
nutmeg-record-outcome = "nutmeg.v4.cli.record_outcome:main"
nutmeg-roi-report = "nutmeg.v4.cli.roi_report:main"
nutmeg-ingest-external = "nutmeg.v4.cli.ingest_external:main"
nutmeg-live-vs-backtest = "nutmeg.v4.cli.live_vs_backtest:main"
nutmeg-experiment-diff = "nutmeg.v4.cli.experiment_diff:main"
nutmeg-recommend-pool = "nutmeg.v4.cli.recommend_pool:main"

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api/src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = []
mypy_path = "apps/api/src"
strict = true
warn_unreachable = true
warn_unused_ignores = true
exclude = ["\\.venv/"]
