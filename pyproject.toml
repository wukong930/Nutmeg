[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nutmeg"
version = "0.1.0"
description = "Football probability prediction platform skeleton for Nutmeg V2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.30",
  # V4 data science stack — added 2026-05-22 for the GBM-lambda + Dixon-Coles redesign
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "duckdb>=1.0",
  "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]

[project.scripts]
nutmeg-api = "nutmeg.main:run"
