[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "tests"]
pythonpath = ["apps/api/src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "apps/api/tests", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = []
mypy_path = "apps/api/src"
strict = true
warn_unreachable = true
warn_unused_ignores = true
exclude = ["\\.venv/"]
